<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Report{% endblock %}</title>
<style>
    body { font-family: sans-serif; font-size: 10pt; }
    h1 { font-size: 14pt; }
    h2 { font-size: 12pt; margin-top: 1.5em; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 0.5em; }
    th, td { border: 1px solid #999; padding: 4px; text-align: left; }
    td.amount, th.amount { text-align: right; }
    tr.total td { font-weight: bold; border-top: 2px solid #000; }
    span.flag-red { background-color: #f8d7da; color: #842029; padding: 2px 6px; }
    span.flag-amber { background-color: #fff3cd; color: #664d03; padding: 2px 6px; }
    span.flag-green { background-color: #d1e7dd; color: #0f5132; padding: 2px 6px; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
